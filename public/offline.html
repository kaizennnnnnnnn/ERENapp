<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eren — offline</title>
<!--
  Served by sw.js when a NAVIGATION fails and nothing is cached for it.

  Everything here is inline and self-contained on purpose. This document is
  what renders when the network is gone, so it cannot depend on the JS bundle,
  on globals.css, or on the Press Start 2P webfont, which is loaded from
  fonts.googleapis.com and will not resolve. The font stack below falls back to
  the platform monospace, which keeps the blocky look without a request.

  Why it exists: the fetch handler only ever matched image URLs, so a cold
  launch with no network never reached the origin and landed on the browser's
  own error page. Inside a display:standalone TWA that page has no address bar
  and no reload control, so the only way out is killing the app.
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0F0A1E;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: linear-gradient(180deg, #241243 0%, #140A26 55%, #0F0A1E 100%);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .scan {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px);
  }
  .panel {
    position: relative;
    width: 100%;
    max-width: 320px;
    padding: 26px 20px 20px;
    background: linear-gradient(180deg, #2E1A52 0%, #1C1035 100%);
    border: 3px solid #6D28D9;
    box-shadow: 4px 4px 0 #0B0715, 0 0 26px 2px rgba(167,139,250,0.28);
    text-align: center;
  }
  .rivet { position: absolute; width: 3px; height: 3px; background: #F5C542; }
  .pixel { font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; }
  h1 {
    margin: 0 0 14px;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 1px;
    color: #FFD9E8;
  }
  p { margin: 0 0 20px; font-size: 12px; line-height: 1.7; color: #C4B5FD; }
  button {
    display: block;
    width: 100%;
    padding: 11px 0;
    font-size: 8px;
    letter-spacing: 1px;
    color: #1C1035;
    background: #F5C542;
    border: 2px solid #0B0715;
    box-shadow: 3px 3px 0 #0B0715;
    cursor: pointer;
  }
  /* The cat, drawn in CSS so it needs no image request. */
  .cat { width: 44px; height: 44px; margin: 0 auto 16px; position: relative; }
  .cat i { position: absolute; display: block; background: #F3EDE7; }
  .ear-l { top: 0; left: 6px; width: 8px; height: 8px; }
  .ear-r { top: 0; right: 6px; width: 8px; height: 8px; }
  .head  { top: 6px; left: 4px; right: 4px; height: 22px; }
  .eye-l { top: 14px; left: 12px; width: 4px; height: 4px; background: #3B2F4A !important; }
  .eye-r { top: 14px; right: 12px; width: 4px; height: 4px; background: #3B2F4A !important; }
  .body  { top: 26px; left: 8px; right: 8px; height: 16px; }
</style>
</head>
<body>
  <div class="scan"></div>

  <div class="panel">
    <span class="rivet" style="top:5px;left:5px"></span>
    <span class="rivet" style="top:5px;right:5px"></span>
    <span class="rivet" style="bottom:5px;left:5px"></span>
    <span class="rivet" style="bottom:5px;right:5px"></span>

    <div class="cat" aria-hidden="true">
      <i class="ear-l"></i><i class="ear-r"></i>
      <i class="head"></i>
      <i class="eye-l"></i><i class="eye-r"></i>
      <i class="body"></i>
    </div>

    <h1 class="pixel">NO CONNECTION</h1>

    <p>
      Your cat is fine — your phone just cannot reach the app right now.
      Everything you have done is saved. Try again when you are back online.
    </p>

    <button class="pixel" type="button" onclick="location.replace('/home')">
      TRY AGAIN
    </button>
  </div>
</body>
</html>
